<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF6B4A">
<meta name="description" content="傻子文案大师 —— 一个专门服务于傻子的工具。不会写文案，点几下就行。">
<title>傻子文案大师 · 一个专门服务于傻子的工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128221;</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================ 顶栏 ============================ -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">傻子文案大师</span>
      <span class="brand-slogan">源依森 · 热麦时尚集合店</span>
    </div>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="切换主题">
      <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</div>

<!-- ============================ 首页 ============================ -->
<section id="homeView" class="page">
  <div class="home-hero">
    <div class="home-badge">一个专门服务于傻子的工具</div>
    <h1 class="home-title">傻子文案大师</h1>
    <p class="home-lead">
      不会写文案，没关系。<br>
      你只管点几下。<br>
      告诉我今天店里准备拍什么，<br>
      剩下的，我替你想。
    </p>
  </div>

  <div class="home-points">
    <div class="home-point"><b>不用写</b><span>全程点选，不给你一个空白输入框</span></div>
    <div class="home-point"><b>不用想</b><span>拍什么、怎么说、多长，选就行</span></div>
    <div class="home-point"><b>直接拍</b><span>出来就是能照着念的口播稿</span></div>
  </div>

  <div class="home-quotes">
    <span>不会写文案？正常。</span>
    <span>想到什么说什么。</span>
    <span>别管怎么写，你负责说人话。</span>
    <span>剩下的交给我。</span>
  </div>

  <div class="home-cta">
    <button class="primary big" id="startBtn" type="button">开始写文案</button>
    <p class="bar-note" id="homeNote">源依森 · 热麦时尚集合店 · 源衣于心，衣身相伴</p>
  </div>
  <div class="bottom-spacer"></div>
</section>

<!-- ============================ 向导 ============================ -->
<section id="wizardView" class="page" hidden>
  <div class="wiz-head">
    <button class="text-btn" id="backBtn" type="button">← 上一步</button>
    <span class="wiz-step" id="stepLabel">第 1 步 / 共 7 步</span>
  </div>
  <div class="prog"><i id="progBar"></i></div>

  <div id="stepHost"></div>

  <div class="wiz-actions" id="stepActions"></div>
  <div class="bottom-spacer"></div>
</section>

<!-- ============================ 结果 ============================ -->
<section id="resultView" class="page" hidden>
  <div class="result-top">
    <button class="text-btn" id="restartBtn" type="button">← 重新填写</button>
    <div class="result-meta" id="resultMeta"></div>
  </div>

  <div class="card result-card">
    <div class="rc-head">
      <h3>视频标题</h3>
      <button class="mini-copy" data-copy="outTitle" type="button">复制</button>
    </div>
    <p class="rc-text title-text" id="outTitle"></p>
  </div>

  <div class="card result-card hook-card">
    <div class="rc-head">
      <h3>3 秒开头</h3>
      <button class="mini-copy" data-copy="outHook" type="button">复制</button>
    </div>
    <p class="rc-text hook-text" id="outHook"></p>
  </div>

  <div class="card result-card">
    <div class="rc-head">
      <h3>完整口播稿</h3>
      <button class="mini-copy" data-copy="outScript" type="button">复制</button>
    </div>
    <p class="rc-text script-text" id="outScript"></p>
  </div>

  <div class="card risk-card" id="riskCard" hidden>
    <div class="rc-head">
      <h3>一点提醒</h3>
    </div>
    <p class="rc-text risk-text" id="outRisk"></p>
  </div>

  <div class="card">
    <h2 class="actions-title">想再改改？</h2>
    <div class="actions">
      <button class="act" data-action="regenerate" type="button">换一版</button>
      <button class="act" data-action="hook" type="button">开头更抓人</button>
      <button class="act" data-action="myvoice" type="button">更像我说话</button>
      <button class="act" data-action="downearth" type="button">更接地气</button>
      <button class="act" data-action="shorter" type="button">短一点</button>
    </div>
    <div class="actions actions-main">
      <button class="primary" id="copyAllBtn" type="button">复制完整口播</button>
      <button class="primary ghost" id="againBtn" type="button">重新填写</button>
    </div>
  </div>
  <div class="bottom-spacer"></div>
</section>

<!-- ============================ 加载遮罩 ============================ -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-box">
    <div class="spinner big-spinner"></div>
    <p id="overlayText">正在帮你写这条视频…</p>
    <p class="overlay-sub">AI 正在想，通常十几秒，偶尔会慢一点</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
